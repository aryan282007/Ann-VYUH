<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="अन्न VYUH - स्मार्ट खेती, समृद्ध किसान" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>अन्न VYUH</title>
  <defs>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC82C"/>
      <stop offset="1" stop-color="#E8930C"/>
    </linearGradient>
  </defs>

  <!-- Wordmark -->
  <text x="24" y="145" font-family="'Noto Sans Devanagari','Mukta','Hind','Mangal',sans-serif" font-size="112" font-weight="800" fill="#1E7B30">अन्न</text>
  <text x="196" y="145" font-family="'Poppins','Montserrat','Segoe UI',Arial,sans-serif" font-size="104" font-weight="800" fill="#7A3B12" letter-spacing="-2">VYUH</text>

  <!-- Wheat ear -->
  <g transform="translate(588,28)">
    <path d="M0 150 C -2 110 2 70 0 28" fill="none" stroke="#E8930C" stroke-width="5" stroke-linecap="round"/>
    <!-- top grain -->
    <ellipse cx="0" cy="12" rx="9" ry="19" fill="url(#grain)"/>
    <!-- left grains -->
    <ellipse cx="-14" cy="42" rx="8" ry="18" fill="url(#grain)" transform="rotate(-32 -14 42)"/>
    <ellipse cx="-15" cy="72" rx="8" ry="18" fill="url(#grain)" transform="rotate(-32 -15 72)"/>
    <ellipse cx="-15" cy="102" rx="8" ry="18" fill="url(#grain)" transform="rotate(-32 -15 102)"/>
    <!-- right grains -->
    <ellipse cx="14" cy="42" rx="8" ry="18" fill="url(#grain)" transform="rotate(32 14 42)"/>
    <ellipse cx="15" cy="72" rx="8" ry="18" fill="url(#grain)" transform="rotate(32 15 72)"/>
    <ellipse cx="15" cy="102" rx="8" ry="18" fill="url(#grain)" transform="rotate(32 15 102)"/>
  </g>

  <!-- Tagline -->
  <text x="320" y="215" text-anchor="middle" font-family="'Noto Sans Devanagari','Mukta','Hind','Mangal',sans-serif" font-size="44" font-weight="700" fill="#1C1C1C">स्मार्ट खेती, समृद्ध किसान</text>
</svg>
