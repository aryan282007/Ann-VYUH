<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610" role="img" aria-label="अन्न VYUH मोबाइल ऐप स्क्रीन" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>अन्न VYUH मोबाइल ऐप</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F5E8"/>
      <stop offset="1" stop-color="#F6FBF4"/>
    </linearGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC82C"/>
      <stop offset="1" stop-color="#E8930C"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A9141"/>
      <stop offset="1" stop-color="#1E7B30"/>
    </linearGradient>
  </defs>

  <!-- No background: transparent -->

  <!-- Phone body -->
  <rect x="30" y="24" width="300" height="560" rx="40" fill="#1E1E1E" stroke="#4A9EEA" stroke-width="3"/>
  <!-- Screen -->
  <rect x="42" y="36" width="276" height="536" rx="30" fill="url(#screen)"/>
  <!-- Notch -->
  <rect x="150" y="46" width="60" height="10" rx="5" fill="#1E1E1E"/>

  <!-- Hills -->
  <path d="M42 480 C 100 440 160 470 220 450 C 260 438 290 452 318 440 L318 542 C318 558 306 572 290 572 L70 572 C54 572 42 558 42 542 Z" fill="#CFEBD4"/>
  <path d="M42 520 C 110 490 170 515 230 500 C 270 490 295 500 318 495 L318 542 C318 558 306 572 290 572 L70 572 C54 572 42 558 42 542 Z" fill="#A9D8B3"/>

  <!-- Logo card -->
  <rect x="56" y="196" width="248" height="190" rx="20" fill="#FFFFFF" stroke="#8FD09B" stroke-width="2.5"/>

  <!-- Wheat ear (centered above wordmark) -->
  <g transform="translate(180,214) scale(0.42)">
    <path d="M0 150 C -2 110 2 70 0 28" fill="none" stroke="#E8930C" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="12" rx="9" ry="19" fill="url(#grain)"/>
    <ellipse cx="-14" cy="42" rx="8" ry="18" fill="url(#grain)" transform="rotate(-32 -14 42)"/>
    <ellipse cx="-15" cy="72" rx="8" ry="18" fill="url(#grain)" transform="rotate(-32 -15 72)"/>
    <ellipse cx="-15" cy="102" rx="8" ry="18" fill="url(#grain)" transform="rotate(-32 -15 102)"/>
    <ellipse cx="14" cy="42" rx="8" ry="18" fill="url(#grain)" transform="rotate(32 14 42)"/>
    <ellipse cx="15" cy="72" rx="8" ry="18" fill="url(#grain)" transform="rotate(32 15 72)"/>
    <ellipse cx="15" cy="102" rx="8" ry="18" fill="url(#grain)" transform="rotate(32 15 102)"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="334" text-anchor="middle" font-family="'Noto Sans Devanagari','Mukta','Hind','Mangal',sans-serif" font-size="44" font-weight="800" fill="#1E7B30">अन्न <tspan font-family="'Poppins','Montserrat','Segoe UI',Arial,sans-serif" fill="#7A3B12" letter-spacing="-1">VYUH</tspan></text>

  <!-- Tagline -->
  <text x="180" y="366" text-anchor="middle" font-family="'Noto Sans Devanagari','Mukta','Hind','Mangal',sans-serif" font-size="16" font-weight="700" fill="#1C1C1C">स्मार्ट खेती, समृद्ध किसान</text>

  <!-- Home indicator -->
  <rect x="140" y="556" width="80" height="5" rx="2.5" fill="#1E7B30" opacity="0.5"/>
</svg>
